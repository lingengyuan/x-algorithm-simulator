name: Monitor X upstream

on:
  schedule:
    - cron: '0 1 * * *' # 09:00 Asia/Shanghai
  workflow_dispatch:
    inputs:
      verify_notifications:
        description: Create and close a test issue to verify notifications and deduplication
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: monitor-x-upstream
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check upstream and notify
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { checkUpstream } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/monitor-upstream.mjs`);
            const result = await checkUpstream({ github, context });
            core.info(JSON.stringify(result));
            await core.summary.addHeading('X upstream check').addCodeBlock(JSON.stringify(result, null, 2), 'json').write();
      - name: Verify notification flow
        if: ${{ inputs.verify_notifications }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { verifyNotifications } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/e2e-upstream-monitor.mjs`);
            const report = await verifyNotifications({ github, context });
            await core.summary.addHeading('Notification E2E').addCodeBlock(JSON.stringify(report, null, 2), 'json').write();
      - name: Save verification report
        if: ${{ always() && inputs.verify_notifications }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-monitor-e2e
          path: artifacts/upstream-monitor/report.json
          if-no-files-found: error
